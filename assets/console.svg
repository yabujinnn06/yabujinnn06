<text x="18" y="136" fill="#FFDC8C">] name</text>
<text x="18" y="152" fill="#FFB41E">"name" is "yAbujiNN"</text>
<text x="18" y="184" fill="#FFDC8C">] motd</text>
<text x="18" y="200" fill="#FFB41E">quiet builder, private signal.</text>
<text x="18" y="232" fill="#FFB41E">I build things around software, AI, and whatever seems</text>
<text x="18" y="248" fill="#FFB41E">interesting enough to keep me awake.</text>
<text x="18" y="280" fill="#FFB41E">I'm not here to pretend I know everything.</text>
<text x="18" y="296" fill="#FFB41E">I'm here to learn fast, build often, and make things</text>
<text x="18" y="312" fill="#FFB41E">that shouldn't exist yet.</text>
<text x="18" y="344" fill="#FFDC8C">] status</text>
<text x="18" y="360" fill="#FFB41E">hostname:  yAbujiNN</text>
<text x="18" y="376" fill="#FFB41E">map     :  de_workbench</text>
<text x="18" y="392" fill="#FFB41E">players :  1 active (0 spectators) (1 max)</text>
<text x="18" y="408" fill="#FFB41E">uptime  :  always</text>
<text x="18" y="424" fill="#FFB41E">status  :  building</text>
<text x="18" y="456" fill="#FFDC8C">] cvarlist currently</text>
<text x="18" y="472" fill="#FFB41E">experimenting   "AI systems"</text>
<text x="18" y="488" fill="#FFB41E">building        "small tools and weird ideas"</text>
<text x="18" y="504" fill="#FFB41E">learning        "by shipping"</text>
<text x="18" y="520" fill="#FFB41E">breaking        "things, then figuring out why"</text>
<text x="18" y="536" fill="#B07D1C">4 cvars</text>
<text x="18" y="568" fill="#FFDC8C">] sv_tags</text>
<text x="18" y="584" fill="#FFB41E">"sv_tags" is "AI, LLMs, Agents, Python, TypeScript, Systems"</text>
<text x="18" y="616" fill="#FFDC8C">] alias</text>
<text x="18" y="632" fill="#FFB41E">+build       : Build first.</text>
<text x="18" y="648" fill="#FFB41E">+understand  : Understand deeper.</text>
<text x="18" y="664" fill="#FFB41E">-noise       : Remove what doesn't matter.</text>
<text x="18" y="680" fill="#B07D1C">3 aliases</text>
<text x="18" y="712" fill="#FFDC8C">] exec philosophy.cfg</text>
<text x="18" y="728" fill="#FFB41E">execing philosophy.cfg</text>
<text x="18" y="744" fill="#FFB41E">I prefer simple systems, small experiments,</text>
<text x="18" y="760" fill="#FFB41E">and projects that teach me something.</text>
<text x="18" y="792" fill="#FFDC8C">] maps *</text>
<text x="18" y="808" fill="#FFB41E">Most things here start as an experiment.</text>
<text x="18" y="824" fill="#FFB41E">Some become useful.</text>
<text x="18" y="840" fill="#FFB41E">Some disappear.</text>
<text x="18" y="856" fill="#FFB41E">That's fine.</text>
<text x="18" y="888" fill="#FFDC8C">] echo some of it shows. most of it stays quiet.</text>
<text x="18" y="904" fill="#FFB41E">some of it shows. most of it stays quiet.</text>
