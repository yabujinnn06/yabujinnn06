<text x="18" y="230" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">map     :  de_workbench</text>
<text x="18" y="247" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">players :  1 active (0 spectators, 0 bots) (1 max)</text>
<text x="18" y="281" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e"># name        userid  uniqueid     state</text>
<text x="18" y="298" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">1 "yAbujiNN"  1       STEAM_0:0:1  active</text>
<text x="18" y="332" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] cl_motd</text>
<text x="18" y="349" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">I build things around software, AI, and whatever seems</text>
<text x="18" y="366" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">interesting enough to keep me awake.</text>
<text x="18" y="400" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">I'm not here to pretend I know everything.</text>
<text x="18" y="417" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">I'm here to learn fast, build often,</text>
<text x="18" y="434" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">and make things that shouldn't exist yet.</text>
<text x="18" y="468" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] cvarlist current</text>
<text x="18" y="485" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  experimenting   "AI systems"</text>
<text x="18" y="502" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  building        "small tools and weird ideas"</text>
<text x="18" y="519" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  learning        "by shipping"</text>
<text x="18" y="536" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  breaking        "things, then figuring out why"</text>
<text x="18" y="570" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] cvarlist interests</text>
<text x="18" y="587" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  ai "1"   llms "1"   agents "1"</text>
<text x="18" y="604" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  python "1"   typescript "1"   systems "1"</text>
<text x="18" y="638" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] alias philosophy</text>
<text x="18" y="655" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  alias +build      "Build first."</text>
<text x="18" y="672" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  alias +understand "Understand deeper."</text>
<text x="18" y="689" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">  alias +remove     "Remove what doesn't matter."</text>
<text x="18" y="723" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] bind "simple" "systems; small experiments; projects that teach me something"</text>
<text x="18" y="740" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] simple</text>
<text x="18" y="757" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Binding executed.</text>
<text x="18" y="791" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] maps projects</text>
<text x="18" y="808" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Most things here start as an experiment.</text>
<text x="18" y="825" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Some become useful.</text>
<text x="18" y="842" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Some disappear.</text>
<text x="18" y="859" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">That's fine.</text>
<text x="18" y="893" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Map list: de_experiment, de_useful, de_gone (3 maps)</text>
<text x="18" y="927" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] echo some of it shows. most of it stays quiet.</text>
