<text x="18" y="60" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Protocol version 48</text>
<text x="18" y="77" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Exe build: 14:22:08 Oct  6 2026 (4554)</text>
<text x="18" y="111" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Console initialized.</text>
