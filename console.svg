<text x="18" y="145" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">Game Mode: yAbujiNN (quiet builder, private signal)</text>
<text x="18" y="179" xml:space="preserve" font-family="'Lucida Console','DejaVu Sans Mono',Consolas,monospace" font-size="13.5" fill="#ffb41e">] status</text>
